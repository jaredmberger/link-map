name: Recovery checks
on:
  pull_request:
    paths: ['functions/api/recovery-export.js','scripts/validate-recovery-backup.mjs','tests/recovery-export-safety.test.mjs','.github/workflows/recovery.yml']
  push:
    branches: [main]
    paths: ['functions/api/recovery-export.js','scripts/validate-recovery-backup.mjs','tests/recovery-export-safety.test.mjs','.github/workflows/recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check functions/api/recovery-export.js
      - run: node --test tests/recovery-export-safety.test.mjs
