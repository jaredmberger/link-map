name: Runtime contract

on:
  pull_request:
    paths:
      - 'functions/api/runtime.js'
      - 'tests/runtime-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/runtime-contract.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/runtime.js'
      - 'tests/runtime-contract.test.mjs'
      - 'package.json'
      - '.github/workflows/runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
