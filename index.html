<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1110">
  <title>Link Map — Ocean Liner Curator</title>
  <meta name="description" content="Visualize and audit internal links across Ocean Liner Curator.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    :root{color-scheme:dark;--bg:#0a1110;--panel:#111a18;--panel2:#17221f;--line:#2b3a35;--text:#f3efe5;--muted:#b7b6ad;--brass:#bfa46a;--danger:#d17979;--good:#8db68f;--purple:#8e7ac8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#17221f 0,#0a1110 42%,#070c0b 100%);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(10,17,16,.92);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px}.flag{width:34px;height:22px;background:#8f1f24;clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}.brand strong{font-family:Georgia,serif;font-size:1.08rem}.brand span{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}.btn.primary{background:var(--brass);color:#17130c;border-color:var(--brass);font-weight:700}.controls{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(4,minmax(135px,.55fr));gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:#0d1513}.control{display:flex;flex-direction:column;gap:5px}.control label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.control input,.control select{width:100%;background:#111a18;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}.graph-wrap{position:relative;min-height:70vh}.graph{position:absolute;inset:0}.status{position:absolute;left:16px;bottom:16px;background:rgba(10,17,16,.9);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--muted);font-size:.82rem;z-index:5;max-width:min(70vw,680px)}.legend{position:absolute;right:16px;top:16px;display:flex;flex-wrap:wrap;gap:7px;background:rgba(10,17,16,.9);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:5}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--brass)}.dot.hub{background:#d7c391}.dot.article{background:var(--purple)}.dot.core{background:var(--good)}.sidebar{border-left:1px solid var(--line);background:rgba(14,22,20,.94);padding:18px;overflow:auto;max-height:calc(100vh - 122px)}.sidebar h2,.sidebar h3{font-family:Georgia,serif;margin:0 0 8px}.sidebar p{color:var(--muted);line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.metric strong{display:block;font-size:1.35rem}.metric span{font-size:.72rem;color:var(--muted);text-transform:uppercase}.list{display:grid;gap:7px;margin:10px 0 18px}.link-row{display:flex;gap:8px;justify-content:space-between;padding:9px 10px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.link-row button{all:unset;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:.68rem;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:var(--muted);white-space:nowrap}.badge.score{border-color:#6b6044;color:#e1cf9c}.audit{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.risk-critical{color:var(--danger)}.risk-weak{color:#d9b16c}.risk-healthy{color:var(--good)}.empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:var(--muted)}.loader{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1100px){.controls{grid-template-columns:1fr 1fr 1fr}.workspace{grid-template-columns:minmax(0,1fr) 340px}}
    @media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(58vh,1fr) auto}.sidebar{border-left:0;border-top:1px solid var(--line);max-height:none}.legend{display:none}}
    @media(max-width:560px){.controls{grid-template-columns:1fr}.actions .btn:not(.primary){display:none}.workspace{grid-template-rows:62vh auto}.sidebar{padding:14px}.metrics{grid-template-columns:repeat(4,1fr)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="/client-crawler.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="flag"></div><div><strong>Link Map</strong><span>Ocean Liner Curator internal-link graph</span></div></div><div class="actions"><button class="btn" id="fitBtn">Fit graph</button><button class="btn" id="exportBtn">Export CSV</button><button class="btn primary" id="refreshBtn">Refresh crawl</button></div></header>
  <section class="controls">
    <div class="control"><label for="search">Find page</label><input id="search" type="search" placeholder="RMS Olympic, Titanic, /ships/…"></div>
    <div class="control"><label for="view">View</label><select id="view"><option value="all">Whole site</option><option value="neighborhood">Selected neighborhood</option><option value="incoming">Incoming links</option><option value="outgoing">Outgoing links</option><option value="weak">Weakly linked pages</option><option value="opportunities">Link opportunities</option></select></div>
    <div class="control"><label for="group">Group</label><select id="group"><option value="all">All page types</option><option value="ship">Ship guides</option><option value="hub">Hubs / indexes</option><option value="article">Articles / answers</option><option value="core">Core pages</option><option value="other">Other</option></select></div>
    <div class="control"><label for="minLinks">Minimum total links</label><select id="minLinks"><option value="0">Any</option><option value="1">1+</option><option value="3">3+</option><option value="6">6+</option><option value="10">10+</option></select></div>
    <div class="control"><label for="layoutMode">Layout</label><select id="layoutMode"><option value="cose">Organic — spacious</option><option value="concentric">Importance rings</option><option value="circle">Circle</option><option value="grid">Grid</option></select></div>
  </section>
  <main class="workspace"><section class="graph-wrap"><div id="graph" class="graph"><div class="empty"><div><div class="loader"></div>Building link map…</div></div></div><div class="legend"><span><i class="dot"></i>Ship/other</span><span><i class="dot hub"></i>Hub</span><span><i class="dot article"></i>Article</span><span><i class="dot core"></i>Core</span></div><div class="status" id="status">Starting crawl…</div></section><aside class="sidebar" id="sidebar"><h2>Site overview</h2><p>Select a page to inspect incoming and outgoing links.</p><div class="metrics" id="overviewMetrics"></div><div class="audit"><h3>Weakest pages</h3><div id="weakList"></div></div></aside></main>
</div>
<script>
const SITE='https://oceanliners.net';let data=null,cy=null,selectedId=null;const $=s=>document.querySelector(s);
function escapeHtml(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function typeFor(url){const p=new URL(url).pathname.toLowerCase();if(p.startsWith('/ships/')&&p!='/ships/ships')return'ship';if(p.includes('hub')||p==='/ships/ships'||p==='/explore'||p==='/site-map')return'hub';if(p.includes('/quick-answer')||p.includes('/articles/')||p.includes('/history/')||(/why-|what-|how-|did-|could-|ocean-liner/.test(p.split('/').pop()||'')))return'article';if(['/','/about','/sources','/provenance','/attribution','/contact','/project-scope'].includes(p.replace(/\/$/,'')||'/'))return'core';return'other'}
function labelFor(page){return page.title||new URL(page.url).pathname||'/'}
function healthFor(p){const minimum={ship:2,article:3,hub:6,core:6,other:2}[p.type]??2;if(p.incoming===0)return['Critical','risk-critical'];if(p.incoming<minimum)return['Needs links','risk-weak'];if(p.incoming<minimum*2)return['Adequate',''];return['Healthy','risk-healthy']}
async function load(){try{if(typeof window.buildLinkMapClient!=='function')throw new Error('Crawler script did not load.');$('#status').textContent='Starting crawl…';data=await window.buildLinkMapClient({onProgress:p=>{$('#status').textContent=`Crawling ${p.seen} pages · ${p.queued} queued · ${new URL(p.url).pathname}`}});render()}catch(e){console.error(e);$('#graph').innerHTML=`<div class="empty"><div><strong>Could not build the Link Map.</strong><p>${escapeHtml(e.message)}</p></div></div>`;$('#status').textContent='Crawl failed.'}}
function annotate(){const incoming=new Map(),outgoing=new Map();for(const p of data.pages){incoming.set(p.url,[]);outgoing.set(p.url,[])}for(const e of data.edges){if(outgoing.has(e.source))outgoing.get(e.source).push(e.target);if(incoming.has(e.target))incoming.get(e.target).push(e.source)}data.pages.forEach(p=>{p.incoming=incoming.get(p.url)||[];p.outgoing=outgoing.get(p.url)||[];p.total=p.incoming.length+p.outgoing.length;p.type=typeFor(p.url);p.neighborSet=new Set([...p.incoming,...p.outgoing]);p.health=healthFor(p)})}
function render(){annotate();const elements=[...data.pages.map(p=>({data:{id:p.url,label:labelFor(p),type:p.type,total:p.total,incoming:p.incoming.length}})),...data.edges.map((e,i)=>({data:{id:'e'+i,source:e.source,target:e.target}}))];$('#graph').innerHTML='';cy=cytoscape({container:$('#graph'),elements,style:[{selector:'node',style:{'background-color':'#bfa46a','label':'','width':'mapData(total,0,40,12,44)','height':'mapData(total,0,40,12,44)'}},{selector:'node.focus,node.hovered',style:{'label':'data(label)','font-size':10,'color':'#f3efe5','text-outline-color':'#0a1110','text-outline-width':2,'border-width':3,'border-color':'#fff','z-index':9999}},{selector:'node[type="hub"]',style:{'background-color':'#d7c391','shape':'diamond'}},{selector:'node[type="article"]',style:{'background-color':'#8e7ac8'}},{selector:'node[type="core"]',style:{'background-color':'#8db68f','shape':'round-rectangle'}},{selector:'node.weakNode',style:{'border-width':2,'border-color':'#d9b16c'}},{selector:'node.orphanNode',style:{'border-width':3,'border-color':'#d17979'}},{selector:'edge',style:{'width':.85,'line-color':'#3d514a','target-arrow-color':'#3d514a','target-arrow-shape':'triangle','curve-style':'bezier','opacity':.2}},{selector:'.dim',style:{'opacity':.02}},{selector:'.connected',style:{'opacity':1}},{selector:'edge.connected',style:{'width':2.4,'line-color':'#bfa46a','target-arrow-color':'#bfa46a','opacity':.95}}],layout:layoutOptions($('#layoutMode').value)});cy.nodes().forEach(n=>{const p=data.pages.find(x=>x.url===n.id());if(p.incoming.length===0)n.addClass('orphanNode');else if(p.health[0]==='Needs links')n.addClass('weakNode')});cy.on('tap','node',evt=>selectNode(evt.target.id()));cy.on('mouseover','node',evt=>evt.target.addClass('hovered'));cy.on('mouseout','node',evt=>evt.target.removeClass('hovered'));cy.on('tap',evt=>{if(evt.target===cy){selectedId=null;applyFilters();renderOverview()}});applyFilters();renderOverview();$('#status').textContent=`${data.pages.length} pages · ${data.edges.length} internal links · crawled ${new Date(data.generatedAt).toLocaleString()}`}
function layoutOptions(mode){if(mode==='concentric')return{name:'concentric',animate:false,fit:true,padding:46,minNodeSpacing:34,concentric:n=>n.data('total'),levelWidth:()=>4};if(mode==='circle')return{name:'circle',animate:false,fit:true,padding:60,avoidOverlap:true,spacingFactor:2.1};if(mode==='grid')return{name:'grid',animate:false,fit:true,padding:50,avoidOverlap:true,avoidOverlapPadding:24};return{name:'cose',animate:false,fit:true,padding:70,nodeRepulsion:42000,idealEdgeLength:190,edgeElasticity:.08,gravity:.045,numIter:2600,componentSpacing:220,nestingFactor:1.8}}
function rerunLayout(){if(!cy)return;cy.layout(layoutOptions($('#layoutMode').value)).run()}
function selectNode(id){selectedId=id;applyFilters();const p=data.pages.find(x=>x.url===id);if(!p)return;const [risk,klass]=p.health;const opp=opportunitiesFor(p).slice(0,15);$('#sidebar').innerHTML=`<h2>${escapeHtml(labelFor(p))}</h2><p>${escapeHtml(new URL(p.url).pathname)}</p><div class="metrics"><div class="metric"><strong>${p.incoming.length}</strong><span>Incoming</span></div><div class="metric"><strong>${p.outgoing.length}</strong><span>Outgoing</span></div><div class="metric"><strong>${p.total}</strong><span>Total</span></div><div class="metric"><strong class="${klass}">${risk}</strong><span>${escapeHtml(p.type)} health</span></div></div><p><a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${escapeHtml(p.url)}">Open page</a></p><h3>Linked from</h3><div class="list">${rows(p.incoming,'incoming')}</div><h3>Links to</h3><div class="list">${rows(p.outgoing,'outgoing')}</div><div class="audit"><h3>Best link opportunities</h3><p>Ranked by shared neighbors and the importance of the candidate page.</p><div class="list">${opportunityRows(opp)}</div></div>`;wireSidebar();focusCamera(id)}
function rows(ids,kind){if(!ids.length)return'<p>No pages found.</p>';return ids.slice(0,50).map(id=>{const p=data.pages.find(x=>x.url===id);return `<div class="link-row"><button data-page="${escapeHtml(id)}">${escapeHtml(p?labelFor(p):id)}</button><span class="badge">${kind}</span></div>`}).join('')}
function opportunitiesFor(p){const direct=new Set([...p.neighborSet,p.url]);return data.pages.filter(q=>q.url!==p.url&&q.type===p.type&&!direct.has(q.url)).map(q=>{let shared=0;for(const n of q.neighborSet)if(p.neighborSet.has(n))shared++;const score=shared*10+Math.min(q.incoming.length,20)+Math.min(q.total,30)/5;return{page:q,shared,score}}).filter(x=>x.shared>0).sort((a,b)=>b.score-a.score||b.shared-a.shared||b.page.incoming-a.page.incoming)}
function opportunityRows(items){if(!items.length)return'<p>No strong opportunities found.</p>';return items.map(x=>`<div class="link-row"><button data-page="${escapeHtml(x.page.url)}">${escapeHtml(labelFor(x.page))}</button><span class="badge score">${x.shared} shared · ${Math.round(x.score)}</span></div>`).join('')}
function topSiteOpportunities(limit=20){const candidates=[];for(const p of data.pages){for(const x of opportunitiesFor(p).slice(0,4)){if(p.url>x.page.url)continue;candidates.push({a:p,b:x.page,shared:x.shared,score:x.score+Math.min(p.incoming.length,20)})}}return candidates.sort((a,b)=>b.score-a.score||b.shared-a.shared).slice(0,limit)}
function applyFilters(){if(!cy)return;cy.elements().removeClass('dim focus connected');const group=$('#group').value,min=Number($('#minLinks').value),view=$('#view').value,q=$('#search').value.trim().toLowerCase();const selected=data.pages.find(x=>x.url===selectedId);const oppSet=new Set(selected?opportunitiesFor(selected).slice(0,30).map(x=>x.page.url):[]);cy.nodes().forEach(n=>{const p=data.pages.find(x=>x.url===n.id());let show=(group==='all'||p.type===group)&&p.total>=min&&(!q||labelFor(p).toLowerCase().includes(q)||p.url.toLowerCase().includes(q));if(view==='weak')show=show&&p.health[0]==='Needs links';if(selectedId&&view==='incoming')show=show&&(n.id()===selectedId||selected?.incoming.includes(p.url));if(selectedId&&view==='outgoing')show=show&&(n.id()===selectedId||selected?.outgoing.includes(p.url));if(selectedId&&view==='neighborhood')show=show&&(n.id()===selectedId||selected?.neighborSet.has(p.url));if(selectedId&&view==='opportunities')show=show&&(n.id()===selectedId||oppSet.has(p.url));if(!show)n.addClass('dim')});if(selectedId){const s=cy.$id(selectedId);s.addClass('focus connected');s.connectedEdges().addClass('connected');s.neighborhood('node').addClass('connected')}}
function renderOverview(){const orphans=data.pages.filter(p=>p.incoming.length===0),weak=data.pages.filter(p=>p.health[0]==='Needs links').sort((a,b)=>a.incoming.length-b.incoming.length||a.total-b.total),hubs=[...data.pages].sort((a,b)=>b.incoming.length-a.incoming.length||b.total-a.total).slice(0,8),ops=topSiteOpportunities(12);$('#sidebar').innerHTML=`<h2>Site overview</h2><p>Health is contextual by page type, so a ship guide is not judged by the same inbound-link threshold as a core hub.</p><div class="metrics"><div class="metric"><strong>${data.pages.length}</strong><span>Pages</span></div><div class="metric"><strong>${data.edges.length}</strong><span>Links</span></div><div class="metric"><strong>${orphans.length}</strong><span>Orphans</span></div><div class="metric"><strong>${weak.length}</strong><span>Needs links</span></div></div><div class="audit"><h3>Strongest hubs</h3><div class="list">${rows(hubs.map(p=>p.url),'hub')}</div><h3>Top sitewide opportunities</h3><div class="list">${ops.map(x=>`<div class="link-row"><button data-page="${escapeHtml(x.a.url)}">${escapeHtml(shortLabel(x.a))} ↔ ${escapeHtml(shortLabel(x.b))}</button><span class="badge score">${x.shared} shared</span></div>`).join('')}</div></div>`;wireSidebar()}
function shortLabel(p){const t=labelFor(p).replace(/\s*[—|-]\s*Ocean Liner Curator.*$/i,'').trim();return t.length>42?t.slice(0,39)+'…':t}
function wireSidebar(){$('#sidebar').querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>selectNode(b.dataset.page)))}
function focusCamera(id){if(!cy)return;const n=cy.$id(id);if(!n.length)return;cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),1.35),duration:280})}
function exportCsv(){if(!data)return;const rows=['url,title,incoming,outgoing,total,type,health',...data.pages.map(p=>[p.url,labelFor(p),p.incoming.length,p.outgoing.length,p.total,p.type,p.health?.[0]||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows],{type:'text/csv'}));a.download='oceanliners-link-map-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
['search','view','group','minLinks'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{applyFilters();if($('#view').value==='opportunities'&&!selectedId)renderOverview()}));$('#layoutMode').addEventListener('change',rerunLayout);$('#fitBtn').onclick=()=>cy?.fit(undefined,50);$('#exportBtn').onclick=exportCsv;$('#refreshBtn').onclick=()=>location.reload();load();
</script>
</body>
</html>
